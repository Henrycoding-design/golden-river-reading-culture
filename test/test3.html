<!-- 
 This is the main PDF flip approach test. Using StPageFlip, a modern, and actively maintained lib.
 Compatible with modern websites
 This file also have windowed loading pages (+-10), reducing memory, more compatible with mobile
  -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Flip Book</title>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- StPageFlip -->
<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#2f2f2f;
    margin: 0;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    width:100vw;
    height:100vh;
    font-family:sans-serif
}

#book{
    width:95vw;
    height:95vh;
    display:none;
}

#loading{
    color:white;
    position:absolute;
    font-size:22px;
}

.page{
    background:white;
    overflow:hidden;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}
</style>

</head>
<body>

<div id="loading">Loading PDF...</div>

<div id="book"></div>

<script>

const pdfUrl = "../assets/test.pdf";
const RENDER_SCALE = 1.5; // Render resolution for PDF.js

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

async function loadBook(){

    const pdf = await pdfjsLib.getDocument(pdfUrl).promise;

    const container = document.getElementById("book");

    // Get the viewport size
    const firstPage = await pdf.getPage(1);
    const firstViewport = firstPage.getViewport({ scale: 1}); // Logical page size for StPageFlip (independent of render quality)

    const pageWidth = firstViewport.width;
    const pageHeight = firstViewport.height;

    const wrappers = [];
    const rendered = new Set();

    //load wrappers first
    for (let i = 1; i <= pdf.numPages; i++) {

        const wrapper = document.createElement("div");
        wrapper.className = "page";

        wrapper.dataset.page = i;

        container.appendChild(wrapper);
        wrappers.push(wrapper);
    }

    async function renderPage(pageNumber) {
        if (rendered.has(pageNumber))
            return;

        const wrapper = wrappers[pageNumber - 1];

        const page = await pdf.getPage(pageNumber);

        const viewport = page.getViewport({
            scale: RENDER_SCALE
        });

        const canvas = document.createElement("canvas");

        canvas.width = viewport.width;
        canvas.height = viewport.height;

        wrapper.replaceChildren(canvas);

        await page.render({
            canvasContext: canvas.getContext("2d"),
            viewport
        }).promise;

        rendered.add(pageNumber);
    }

    function unloadPage(pageNumber) {
        if (!rendered.has(pageNumber))
            return;

        wrappers[pageNumber - 1].replaceChildren();

        rendered.delete(pageNumber);
    }

    const WINDOW = 10;

    async function updateWindow(current) {

        const start = Math.max(1, current - WINDOW);
        const end = Math.min(pdf.numPages, current + WINDOW);

        // Render nearby pages
        for (let i = start; i <= end; i++) {
            renderPage(i);
        }

        // Remove distant pages
        for (const page of [...rendered]) {

            if (page < start || page > end)
                unloadPage(page);

        }
    }

    document.getElementById("loading").style.display="none";
    container.style.display="block";

    const pageFlip = new St.PageFlip(container, {
        width: pageWidth,
        height: pageHeight,

        size: "stretch",
        autoSize: true,

        showCover: true,
        drawShadow: true,
        maxShadowOpacity: 0.5,

        mobileScrollSupport: true,
        useMouseEvents: true,

        flippingTime: 700,
        startPage: 0
    });

    // preload wrappers
    pageFlip.loadFromHTML(wrappers);
    // start rendering
    await updateWindow(1);

    // update loading pages/unloading pages on flip
    pageFlip.on("flip", e => {

        updateWindow(e.data + 1);

    });

    // Keyboard navigation
    document.addEventListener("keydown",(e)=>{

        if(e.key==="ArrowRight"){
            pageFlip.flipNext();
        }

        if(e.key==="ArrowLeft"){
            pageFlip.flipPrev();
        }

    });

    // Window resize with debounce
    let resizeTimer;

    window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);

        resizeTimer = setTimeout(() => {
            pageFlip.update();
        }, 100);
    });

}

loadBook();

</script>

</body>
</html>
