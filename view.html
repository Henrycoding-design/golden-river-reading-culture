<!--
 This is the main PDF flip approach test. Using StPageFlip, a modern, and actively maintained lib.
 Compatible with modern websites
 This file also have windowed loading pages (+-10), reducing memory, more compatible on mobile
 also integrated with dynamic usePortrait param to enhance readability on both small and big screens
 by switching between one-page and two-page display

 Added:
 - Zoom controller
 - Page navigation controller
 - Direct page input
 - Drag/pan support while zoomed
 - Hide/show controller button
-->

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF FlipBook | Vinschool Golden River - Tạp Chí Đọc</title>

<link rel="icon" href="./assets/logo-vinschool.png" type="image/png">

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!--
 StPageFlip v2.0.7
 Pinned version for project stability.
 Tested with PDF.js 3.11.174.
-->
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:
        radial-gradient(
            circle at top left,
            rgba(232,127,36,0.2),
            transparent 32vw
        ),
        radial-gradient(
            circle at bottom right,
            rgba(115,165,202,0.18),
            transparent 34vw
        ),
        #2f2f2f;

    overflow:hidden;

    width:100vw;
    height:100vh;

    font-family:"Plus Jakarta Sans", Arial, sans-serif;
}


/* --------------------------------------------------
   BOOK VIEWPORT
-------------------------------------------------- */

#book-viewport{
    position:fixed;

    inset:0;

    width:100vw;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    touch-action:none;
}


/* --------------------------------------------------
   BOOK
-------------------------------------------------- */

#book{
    width:95vw;
    height:95vh;

    display:none;

    transform-origin:center center;

    will-change:transform;

    transition:transform 0.2s ease;
}

.page{
    background:white;
    overflow:hidden;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}


/* --------------------------------------------------
   LOADING
-------------------------------------------------- */

#loading{
    color:white;

    position:absolute;

    font-size:22px;

    letter-spacing:0.02em;
}


/* --------------------------------------------------
   CONTROLS
-------------------------------------------------- */

#controls{
    position:fixed;

    left:50%;
    bottom:20px;

    transform:translateX(-50%);

    display:flex;
    align-items:center;

    gap:8px;

    padding:8px 10px;

    background:rgba(25,25,25,0.88);

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    border:1px solid rgba(255,255,255,0.12);

    border-radius:14px;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.35);

    color:white;

    z-index:1000;

    user-select:none;
}


/* --------------------------------------------------
   GENERIC CONTROL BUTTON
-------------------------------------------------- */

.control-btn{
    width:34px;
    height:34px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:none;
    border-radius:9px;

    background:rgba(255,255,255,0.08);

    color:white;

    font-size:18px;
    line-height:1;

    cursor:pointer;

    transition:
        background 0.15s ease,
        transform 0.15s ease;
}

.control-btn:hover{
    background:rgba(255,255,255,0.16);
}

.control-btn:active{
    transform:scale(0.92);
}

.control-btn:disabled{
    opacity:0.3;
    cursor:not-allowed;
}


/* --------------------------------------------------
   PAGE INDICATOR
-------------------------------------------------- */

#page-indicator{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:4px;

    min-width:82px;

    text-align:center;

    font-size:14px;
    font-weight:600;

    letter-spacing:0.02em;
}


/* Current page input */

#page-input{
    width:42px;
    height:30px;

    padding:0 4px;

    border:none;
    border-radius:7px;

    background:rgba(255,255,255,0.1);

    color:white;

    text-align:center;

    font-family:inherit;
    font-size:13px;
    font-weight:600;

    outline:none;

    transition:
        background 0.15s ease,
        box-shadow 0.15s ease;
}


/* Remove number arrows */

#page-input::-webkit-inner-spin-button,
#page-input::-webkit-outer-spin-button{
    -webkit-appearance:none;
    margin:0;
}

#page-input{
    appearance:textfield;
}


/* Input focus */

#page-input:focus{
    background:rgba(255,255,255,0.18);

    box-shadow:
        0 0 0 2px rgba(255,255,255,0.18);
}


/* Total page number */

#total-pages{
    min-width:22px;

    color:rgba(255,255,255,0.7);
}


/* --------------------------------------------------
   DIVIDER
-------------------------------------------------- */

.control-divider{
    width:1px;
    height:22px;

    background:rgba(255,255,255,0.15);

    margin:0 3px;
}


/* --------------------------------------------------
   ZOOM VALUE
-------------------------------------------------- */

#zoom-value{
    min-width:46px;

    text-align:center;

    font-size:13px;

    font-weight:600;

    color:rgba(255,255,255,0.85);
}


/* --------------------------------------------------
   ZOOM SLIDER
-------------------------------------------------- */

#zoom-slider{
    width:90px;

    cursor:pointer;
}


/* --------------------------------------------------
   HIDE BUTTON
-------------------------------------------------- */

#hide-controls{
    font-size:17px;

    background:rgba(255,255,255,0.06);
}

#hide-controls:hover{
    background:rgba(255,80,80,0.22);
}


/* --------------------------------------------------
   SHOW CONTROLS
-------------------------------------------------- */

#show-controls{
    position:fixed;

    right:18px;
    bottom:18px;

    width:42px;
    height:42px;

    display:none;

    align-items:center;
    justify-content:center;

    border:none;
    border-radius:12px;

    background:rgba(25,25,25,0.88);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,0.12);

    color:white;

    font-size:18px;

    cursor:pointer;

    z-index:1001;

    box-shadow:
        0 6px 20px rgba(0,0,0,0.3);

    transition:
        background 0.15s ease,
        transform 0.15s ease;
}

#show-controls:hover{
    background:rgba(255,255,255,0.16);
}

#show-controls:active{
    transform:scale(0.92);
}


/* --------------------------------------------------
   PAN CURSOR
-------------------------------------------------- */

#book-viewport.is-pannable{
    cursor:grab;
}

#book-viewport.is-panning{
    cursor:grabbing;
}

#book-viewport.is-panning #book{
    transition:none;
}

/* --------------------------------------------------
   ZOOM / PAN TIP POPUP
-------------------------------------------------- */

#zoom-pan-tip{
    position:fixed;
    left:50%;
    bottom:82px;

    transform:translateX(-50%);

    width:max-content;
    max-width:min(520px, calc(100vw - 32px));

    padding:12px 40px 12px 16px;

    background:rgba(25,25,25,0.94);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    border:1px solid rgba(255,255,255,0.14);
    border-radius:12px;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.35);

    color:white;

    font-size:13px;
    line-height:1.5;

    z-index:1002;

    animation:zoomTipIn 0.2s ease;
}

#zoom-pan-tip strong{
    display:block;
    margin-bottom:2px;
    font-size:13px;
}

#zoom-pan-tip-close{
    position:absolute;
    top:6px;
    right:7px;

    width:24px;
    height:24px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:none;
    border-radius:6px;

    background:transparent;
    color:rgba(255,255,255,0.7);

    font-size:17px;
    line-height:1;

    cursor:pointer;
}

#zoom-pan-tip-close:hover{
    background:rgba(255,255,255,0.12);
    color:white;
}

@keyframes zoomTipIn{
    from{
        opacity:0;
        transform:translate(-50%, 8px);
    }

    to{
        opacity:1;
        transform:translate(-50%, 0);
    }
}


/* --------------------------------------------------
   MOBILE
-------------------------------------------------- */

@media (max-width:600px){

    #controls{
        bottom:12px;

        padding:7px 8px;

        gap:5px;

        border-radius:12px;
    }

    .control-btn{
        width:32px;
        height:32px;
    }

    #page-indicator{
        min-width:72px;
        font-size:13px;
    }

    #page-input{
        width:38px;
        height:28px;

        font-size:12px;
    }

    #total-pages{
        min-width:18px;
    }

    #zoom-slider{
        width:65px;
    }

    #zoom-value{
        min-width:40px;
        font-size:12px;
    }

    #show-controls{
        right:12px;
        bottom:12px;
    }
}

</style>

</head>

<body>

<div id="loading">
    Loading magazine...
</div>


<!--
 The viewport clips the zoomed book.
 The book itself is moved inside this viewport.
-->
<div id="book-viewport">
    <div id="book"></div>
</div>


<!-- --------------------------------------------------
     CONTROLS
-------------------------------------------------- -->

<div id="controls">

    <!-- Previous page -->
    <button
        id="prev-btn"
        class="control-btn"
        aria-label="Previous page"
        title="Previous page"
    >
        &lt;
    </button>


    <!-- Current page / total pages -->
    <div id="page-indicator">

        <input
            id="page-input"
            type="number"
            min="1"
            value="1"
            aria-label="Current page"
            title="Go to page"
        >

        <span>/</span>

        <span id="total-pages">
            1
        </span>

    </div>


    <!-- Next page -->
    <button
        id="next-btn"
        class="control-btn"
        aria-label="Next page"
        title="Next page"
    >
        &gt;
    </button>


    <div class="control-divider"></div>


    <!-- Zoom out -->
    <button
        id="zoom-out"
        class="control-btn"
        aria-label="Zoom out"
        title="Zoom out"
    >
        −
    </button>


    <!-- Zoom slider -->
    <input
        id="zoom-slider"
        type="range"
        min="0.75"
        max="1.50"
        step="0.05"
        value="1"
        aria-label="Zoom"
    >


    <!-- Zoom in -->
    <button
        id="zoom-in"
        class="control-btn"
        aria-label="Zoom in"
        title="Zoom in"
    >
        +
    </button>


    <!-- Zoom percentage -->
    <div id="zoom-value">
        100%
    </div>


    <div class="control-divider"></div>


    <!-- Hide controls -->
    <button
        id="hide-controls"
        class="control-btn"
        aria-label="Hide controls"
        title="Hide controls"
    >
        ×
    </button>

    <!-- Zoom / pan usage tip -->
    <div id="zoom-pan-tip" hidden>

        <button
            id="zoom-pan-tip-close"
            type="button"
            aria-label="Close"
            title="Close"
        >
            ×
        </button>

        <strong>EN</strong>
        Move/pan your screen while zooming by using two fingers on a touchpad.
        Or use your finger to move around on a touch-supported screen.

        <strong style="margin-top:6px;">VI</strong>
        Khi đang phóng to, dùng hai ngón tay trên bàn di chuột để di chuyển.
        Hoặc dùng ngón tay để di chuyển trên màn hình cảm ứng.

    </div>

</div>


<!-- Show controls -->
<button
    id="show-controls"
    aria-label="Show controls"
    title="Show controls"
>
    ☰
</button>


<script>


// --------------------------------------------------
// PDF CONFIGURATION
// --------------------------------------------------

const urlParams =
    new URLSearchParams(
        window.location.search
    );

const pdfUrl =
    urlParams.get('pdf') ||
    "assets/release/test.pdf";

const RENDER_SCALE = 1.5;


pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


// --------------------------------------------------
// LOAD BOOK
// --------------------------------------------------

async function loadBook(){

    const pdf =
        await pdfjsLib
            .getDocument(pdfUrl)
            .promise;


    const viewportElement =
        document.getElementById(
            "book-viewport"
        );


    const container =
        document.getElementById(
            "book"
        );


    // --------------------------------------------------
    // GET PDF PAGE SIZE
    // --------------------------------------------------

    const firstPage =
        await pdf.getPage(1);


    const firstViewport =
        firstPage.getViewport({
            scale:1
        });


    const pageWidth =
        firstViewport.width;


    const pageHeight =
        firstViewport.height;


    // --------------------------------------------------
    // PAGE WRAPPERS
    // --------------------------------------------------

    const wrappers = [];

    const rendered = new Set();


    for(
        let i = 1;
        i <= pdf.numPages;
        i++
    ){

        const wrapper =
            document.createElement(
                "div"
            );


        wrapper.className =
            "page";


        wrapper.dataset.page =
            i;


        container.appendChild(
            wrapper
        );


        wrappers.push(
            wrapper
        );

    }


    // --------------------------------------------------
    // RENDER PAGE
    // --------------------------------------------------

    async function renderPage(
        pageNumber
    ){

        if(
            rendered.has(
                pageNumber
            )
        ){

            return;

        }


        const wrapper =
            wrappers[
                pageNumber - 1
            ];


        const page =
            await pdf.getPage(
                pageNumber
            );


        const viewport =
            page.getViewport({
                scale:RENDER_SCALE
            });


        const canvas =
            document.createElement(
                "canvas"
            );


        canvas.width =
            viewport.width;


        canvas.height =
            viewport.height;


        await page.render({

            canvasContext:
                canvas.getContext(
                    "2d"
                ),

            viewport

        }).promise;


        // Convert canvas to WebP

        const img =
            document.createElement(
                "img"
            );


        img.src =
            canvas.toDataURL(
                "image/webp",
                0.8
            );


        img.style.width =
            "100%";

        img.style.height =
            "100%";

        img.style.display =
            "block";


        wrapper.replaceChildren(
            img
        );


        rendered.add(
            pageNumber
        );

    }


    // --------------------------------------------------
    // UNLOAD PAGE
    // --------------------------------------------------

    function unloadPage(
        pageNumber
    ){

        if(
            !rendered.has(
                pageNumber
            )
        ){

            return;

        }


        wrappers[
            pageNumber - 1
        ].replaceChildren();


        rendered.delete(
            pageNumber
        );

    }


    // --------------------------------------------------
    // WINDOWED PAGE LOADING
    // --------------------------------------------------

    const WINDOW = 10;


    async function updateWindow(
        current
    ){

        const start =
            Math.max(
                1,
                current - WINDOW
            );


        const end =
            Math.min(
                pdf.numPages,
                current + WINDOW
            );


        // Render nearby pages
        for(
            let i = start;
            i <= end;
            i++
        ){

            renderPage(i);

        }


        // Remove distant pages
        for(
            const page of [...rendered]
        ){

            if(
                page < start ||
                page > end
            ){

                unloadPage(page);

            }

        }

    }


    // --------------------------------------------------
    // SHOW BOOK
    // --------------------------------------------------

    document
        .getElementById("loading")
        .style.display =
            "none";


    container.style.display =
        "block";


    // --------------------------------------------------
    // PAGE FLIP SIZE
    // --------------------------------------------------

    const mobile =
        window.innerWidth < 768;


    const widthScale =
        mobile
            ? 0.5
            : 0.75;


    const heightScale =
        mobile
            ? 0.5
            : 0.65;


    // --------------------------------------------------
    // ST PAGE FLIP
    // --------------------------------------------------

    const pageFlip =
        new St.PageFlip(
            container,
            {

                width:
                    pageWidth *
                    widthScale,

                height:
                    pageHeight *
                    heightScale,

                /*
                 Do not use:
                    size: "stretch"
                    autoSize: true

                 They break usePortrait
                 in StPageFlip 2.0.7.
                */

                usePortrait:true,

                showCover:true,

                drawShadow:true,

                maxShadowOpacity:0.5,

                mobileScrollSupport:true,

                useMouseEvents:true,

                flippingTime:850,

                startPage:0

            }
        );


    pageFlip.loadFromHTML(
        wrappers
    );


    await new Promise(
        requestAnimationFrame
    );


    // --------------------------------------------------
    // INITIAL PAGE
    // --------------------------------------------------

    await updateWindow(1);


    // --------------------------------------------------
    // PAGE UI
    // --------------------------------------------------

    const pageInput =
        document.getElementById(
            "page-input"
        );


    const totalPages =
        document.getElementById(
            "total-pages"
        );


    const prevButton =
        document.getElementById(
            "prev-btn"
        );


    const nextButton =
        document.getElementById(
            "next-btn"
        );


    totalPages.textContent =
        pdf.numPages;


    function updatePageUI(
        pageIndex
    ){

        const currentPage =
            pageIndex + 1;


        pageInput.value =
            currentPage;


        prevButton.disabled =
            currentPage <= 1;


        nextButton.disabled =
            currentPage >=
            pdf.numPages;

    }


    updatePageUI(0);


    // --------------------------------------------------
    // GO TO PAGE
    // --------------------------------------------------

    function goToPage(value){

        let page =
            parseInt(
                value,
                10
            );


        /*
         Invalid input:
         restore current page.
        */

        if(
            Number.isNaN(page)
        ){

            pageInput.value =
                pageFlip
                    .getCurrentPageIndex() + 1;

            return;

        }


        /*
         Clamp to valid range.
        */

        page =
            Math.max(
                1,
                Math.min(
                    pdf.numPages,
                    page
                )
            );


        pageInput.value =
            page;


        const targetIndex =
            page - 1;


        const currentIndex =
            pageFlip.getCurrentPageIndex();


        if(
            targetIndex ===
            currentIndex
        ){

            return;

        }


        pageFlip.turnToPage(
            targetIndex
        );

    }


    // --------------------------------------------------
    // PAGE INPUT — ENTER
    // --------------------------------------------------

    pageInput.addEventListener(
        "keydown",
        e => {

            if(
                e.key === "Enter"
            ){

                e.preventDefault();

                goToPage(
                    pageInput.value
                );

                pageInput.blur();

            }


            /*
             ArrowUp / ArrowDown:
             quickly move one page.
            */

            if(
                e.key === "ArrowUp"
            ){

                e.preventDefault();

                pageInput.stepUp();

                goToPage(
                    pageInput.value
                );

            }


            if(
                e.key === "ArrowDown"
            ){

                e.preventDefault();

                pageInput.stepDown();

                goToPage(
                    pageInput.value
                );

            }

        }
    );


    // --------------------------------------------------
    // PAGE INPUT — BLUR
    // --------------------------------------------------

    pageInput.addEventListener(
        "blur",
        () => {

            goToPage(
                pageInput.value
            );

        }
    );


    // --------------------------------------------------
    // PREVENT FLIP EVENTS
    // --------------------------------------------------

    pageInput.addEventListener(
        "pointerdown",
        e => {

            e.stopPropagation();

        }
    );


    pageInput.addEventListener(
        "click",
        e => {

            e.stopPropagation();

        }
    );


    // --------------------------------------------------
    // FLIP EVENT
    // --------------------------------------------------

    pageFlip.on(
        "flip",
        e => {

            const currentPage =
                e.data + 1;


            updateWindow(
                currentPage
            );


            updatePageUI(
                e.data
            );

        }
    );


    // --------------------------------------------------
    // PAGE NAVIGATION
    // --------------------------------------------------

    prevButton.addEventListener(
        "click",
        () => {

            pageFlip.flipPrev();

        }
    );


    nextButton.addEventListener(
        "click",
        () => {

            pageFlip.flipNext();

        }
    );


    // --------------------------------------------------
    // ZOOM CONTROLS
    // --------------------------------------------------

    const zoomSlider =
        document.getElementById(
            "zoom-slider"
        );


    const zoomValue =
        document.getElementById(
            "zoom-value"
        );


    const zoomIn =
        document.getElementById(
            "zoom-in"
        );


    const zoomOut =
        document.getElementById(
            "zoom-out"
        );


    let zoom = 1;

    let panX = 0;
    let panY = 0;

    // --------------------------------------------------
    // ZOOM / PAN TIP
    // --------------------------------------------------

    const zoomPanTip =
        document.getElementById("zoom-pan-tip");

    const zoomPanTipClose =
        document.getElementById("zoom-pan-tip-close");

    const ZOOM_PAN_TIP_KEY =
        "pdfFlipBook.zoomPanTipDisplayed";

    function showZoomPanTip(){

        if(
            localStorage.getItem(
                ZOOM_PAN_TIP_KEY
            ) === "true"
        ){
            return;
        }

        zoomPanTip.hidden = false;

        localStorage.setItem(
            ZOOM_PAN_TIP_KEY,
            "true"
        );
    }


    function closeZoomPanTip(){

        zoomPanTip.hidden = true;

        localStorage.setItem(
            ZOOM_PAN_TIP_KEY,
            "true"
        );

    }


    zoomPanTipClose.addEventListener(
        "click",
        closeZoomPanTip
    );


    // --------------------------------------------------
    // PAN BOUNDS
    // --------------------------------------------------

    function getPanBounds(){

        const viewportWidth =
            viewportElement.clientWidth;


        const viewportHeight =
            viewportElement.clientHeight;


        const bookWidth =
            container.offsetWidth *
            zoom;


        const bookHeight =
            container.offsetHeight *
            zoom;


        const maxX =
            Math.max(
                0,
                (bookWidth -
                    viewportWidth) / 2
            );


        const maxY =
            Math.max(
                0,
                (bookHeight -
                    viewportHeight) / 2
            );


        return {
            maxX,
            maxY
        };

    }


    // --------------------------------------------------
    // CLAMP PAN
    // --------------------------------------------------

    function clampPan(){

        const bounds =
            getPanBounds();


        panX =
            Math.max(
                -bounds.maxX,
                Math.min(
                    bounds.maxX,
                    panX
                )
            );


        panY =
            Math.max(
                -bounds.maxY,
                Math.min(
                    bounds.maxY,
                    panY
                )
            );

    }


    // --------------------------------------------------
    // APPLY TRANSFORM
    // --------------------------------------------------

    function applyTransform(){

        clampPan();


        container.style.transform =
            `translate3d(
                ${panX}px,
                ${panY}px,
                0
            ) scale(${zoom})`;


        zoomSlider.value =
            zoom;


        zoomValue.textContent =
            `${Math.round(
                zoom * 100
            )}%`;


        if(
            zoom > 1
        ){

            viewportElement.classList.add(
                "is-pannable"
            );

        }else{

            viewportElement.classList.remove(
                "is-pannable"
            );

        }

    }

    // --------------------------------------------------
    // EVENT ISOLATION & ZOOM INTERACTION CONTROLLER
    // --------------------------------------------------
    // When zoom > 1 (> 100%):
    // 1. Intercept mousedown/touchstart in capture phase so StPageFlip's
    //    internal page-drag/curl engine is isolated during pan.
    // 2. Use Pointer Events for smooth panning.
    // 3. Distinguish pan vs click:
    //    - Movement > 6px: PAN gesture (no page flip).
    //    - Movement <= 6px: CLICK gesture (triggers page flip without pan jump).
    // 4. Multi-touch (2 fingers) pinches to zoom & pans.
    // 5. Wheel/trackpad scrolling smoothly pans, ctrl+wheel zooms.
    // When zoom <= 1 (100%):
    //    Native StPageFlip interactions work unmodified.

    function isControlTarget(target){
        return Boolean(
            target &&
            (target.closest("#controls") ||
             target.closest("#show-controls"))
        );
    }

    viewportElement.addEventListener(
        "mousedown",
        e => {
            if(zoom > 1 && !isControlTarget(e.target)){
                e.stopPropagation();
            }
        },
        { capture:true }
    );

    viewportElement.addEventListener(
        "touchstart",
        e => {
            if(zoom > 1 && !isControlTarget(e.target)){
                if(e.touches.length === 1){
                    e.stopPropagation();
                }
            }
        },
        { capture:true, passive:false }
    );


    // --------------------------------------------------
    // APPLY ZOOM
    // --------------------------------------------------

    function applyZoom(
        value,
        preservePan = true
    ){

        const oldZoom =
            zoom;


        zoom =
            Math.min(
                1.50,
                Math.max(
                    0.75,
                    value
                )
            );

        zoom =
            Math.round(zoom * 100) / 100;

        // Show the pan instruction only when
        // crossing from <=100% to >100%.
        if(
            oldZoom <= 1 &&
            zoom > 1
        ){
            showZoomPanTip();
        }


        /*
         Preserve the current
         viewing position while zooming.
        */

        if(
            preservePan &&
            oldZoom !== 0
        ){

            const ratio =
                zoom / oldZoom;


            panX *= ratio;
            panY *= ratio;

        }


        /*
         At 100%, return to center.
        */

        if(
            zoom <= 1
        ){

            panX = 0;
            panY = 0;

        }


        applyTransform();

    }


    // --------------------------------------------------
    // ZOOM SLIDER
    // --------------------------------------------------

    zoomSlider.addEventListener(
        "input",
        () => {

            applyZoom(
                parseFloat(
                    zoomSlider.value
                )
            );

        }
    );


    // --------------------------------------------------
    // ZOOM IN
    // --------------------------------------------------

    zoomIn.addEventListener(
        "click",
        () => {

            applyZoom(
                zoom + 0.05
            );

        }
    );


    // --------------------------------------------------
    // ZOOM OUT
    // --------------------------------------------------

    zoomOut.addEventListener(
        "click",
        () => {

            applyZoom(
                zoom - 0.05
            );

        }
    );


    // --------------------------------------------------
    // DOUBLE CLICK RESET
    // --------------------------------------------------

    viewportElement.addEventListener(
        "dblclick",
        e => {

            if(isControlTarget(e.target)){
                return;
            }

            if(zoom > 1){
                applyZoom(1, false);
            }else{
                applyZoom(1.25, true);
            }

        }
    );


    // --------------------------------------------------
    // UNIFIED POINTER PAN & CLICK-TO-FLIP
    // --------------------------------------------------

    let isPointerDown = false;
    let isPanActive = false;
    let activePointerId = null;

    let ptrStartX = 0;
    let ptrStartY = 0;

    let ptrInitialPanX = 0;
    let ptrInitialPanY = 0;

    let ptrStartTime = 0;

    const DRAG_THRESHOLD = 6;

    viewportElement.addEventListener(
        "pointerdown",
        e => {

            if(
                zoom <= 1 ||
                isControlTarget(e.target)
            ){
                return;
            }

            if(isPointerDown){
                return;
            }

            isPointerDown = true;
            isPanActive = false;
            activePointerId = e.pointerId;

            ptrStartX = e.clientX;
            ptrStartY = e.clientY;

            ptrInitialPanX = panX;
            ptrInitialPanY = panY;

            ptrStartTime = performance.now();

            try{
                viewportElement.setPointerCapture(e.pointerId);
            }catch(_){}

        },
        { capture:true }
    );


    viewportElement.addEventListener(
        "pointermove",
        e => {

            if(
                !isPointerDown ||
                e.pointerId !== activePointerId
            ){
                return;
            }

            const deltaX =
                e.clientX - ptrStartX;

            const deltaY =
                e.clientY - ptrStartY;

            const dist =
                Math.hypot(deltaX, deltaY);

            if(!isPanActive){
                if(dist > DRAG_THRESHOLD){
                    isPanActive = true;
                    viewportElement.classList.add(
                        "is-panning"
                    );
                }else{
                    return;
                }
            }

            panX =
                ptrInitialPanX + deltaX;

            panY =
                ptrInitialPanY + deltaY;

            applyTransform();

        },
        { capture:true }
    );


    function endPointerInteraction(e){

        if(
            !isPointerDown ||
            (e && e.pointerId !== activePointerId)
        ){
            return;
        }

        const wasPan =
            isPanActive;

        const clickX =
            e ? e.clientX : ptrStartX;

        const duration =
            performance.now() - ptrStartTime;

        isPointerDown = false;
        isPanActive = false;
        activePointerId = null;

        viewportElement.classList.remove(
            "is-panning"
        );

        if(
            e &&
            viewportElement.hasPointerCapture(e.pointerId)
        ){
            try{
                viewportElement.releasePointerCapture(e.pointerId);
            }catch(_){}
        }

        // If panning took place, don't trigger flip
        if(wasPan){
            return;
        }

        // Clean tap/click when zoomed in: trigger intentional page flip
        if(duration < 500 && zoom > 1){
            const vpRect =
                viewportElement.getBoundingClientRect();

            const relX =
                clickX - vpRect.left;

            const mid =
                vpRect.width / 2;

            if(relX < mid - 20){
                pageFlip.flipPrev();
            }else if(relX > mid + 20){
                pageFlip.flipNext();
            }else{
                if(relX < mid){
                    pageFlip.flipPrev();
                }else{
                    pageFlip.flipNext();
                }
            }
        }

    }


    viewportElement.addEventListener(
        "pointerup",
        endPointerInteraction,
        { capture:true }
    );

    viewportElement.addEventListener(
        "pointercancel",
        endPointerInteraction,
        { capture:true }
    );


    // --------------------------------------------------
    // TWO-FINGER TOUCH PINCH & PAN (MOBILE)
    // --------------------------------------------------

    let isPinching = false;
    let pinchStartDist = 0;
    let pinchStartZoom = 1;
    let pinchMidX = 0;
    let pinchMidY = 0;
    let pinchPanStartX = 0;
    let pinchPanStartY = 0;

    viewportElement.addEventListener(
        "touchstart",
        e => {

            if(
                e.touches.length === 2 &&
                !isControlTarget(e.target)
            ){
                e.preventDefault();

                isPointerDown = false;
                isPanActive = false;

                viewportElement.classList.add(
                    "is-panning"
                );

                const t1 = e.touches[0];
                const t2 = e.touches[1];

                pinchStartDist =
                    Math.hypot(
                        t2.clientX - t1.clientX,
                        t2.clientY - t1.clientY
                    );

                pinchStartZoom =
                    zoom;

                pinchMidX =
                    (t1.clientX + t2.clientX) / 2;

                pinchMidY =
                    (t1.clientY + t2.clientY) / 2;

                pinchPanStartX =
                    panX;

                pinchPanStartY =
                    panY;

                isPinching = true;
            }

        },
        { passive:false }
    );


    viewportElement.addEventListener(
        "touchmove",
        e => {

            if(
                isPinching &&
                e.touches.length === 2
            ){
                e.preventDefault();

                const t1 = e.touches[0];
                const t2 = e.touches[1];

                const currentDist =
                    Math.hypot(
                        t2.clientX - t1.clientX,
                        t2.clientY - t1.clientY
                    );

                const currentMidX =
                    (t1.clientX + t2.clientX) / 2;

                const currentMidY =
                    (t1.clientY + t2.clientY) / 2;

                if(pinchStartDist > 0){
                    const scaleFactor =
                        currentDist / pinchStartDist;

                    const newZoom =
                        Math.min(
                            1.50,
                            Math.max(
                                0.75,
                                pinchStartZoom * scaleFactor
                            )
                        );

                    zoom =
                        Math.round(newZoom * 100) / 100;
                }

                panX =
                    pinchPanStartX +
                    (currentMidX - pinchMidX);

                panY =
                    pinchPanStartY +
                    (currentMidY - pinchMidY);

                if(zoom <= 1){
                    panX = 0;
                    panY = 0;
                }

                applyTransform();
            }

        },
        { passive:false }
    );


    function endPinch(e){

        if(isPinching){
            if(!e.touches || e.touches.length < 2){
                isPinching = false;

                viewportElement.classList.remove(
                    "is-panning"
                );

                applyZoom(zoom, true);
            }
        }

    }

    viewportElement.addEventListener(
        "touchend",
        endPinch
    );

    viewportElement.addEventListener(
        "touchcancel",
        endPinch
    );


    // --------------------------------------------------
    // MOUSE WHEEL / TRACKPAD PAN & PINCH ZOOM
    // --------------------------------------------------

    viewportElement.addEventListener(
        "wheel",
        e => {

            if(isControlTarget(e.target)){
                return;
            }

            if(e.ctrlKey){
                e.preventDefault();
                applyZoom(
                    zoom - e.deltaY * 0.005
                );
            }else if(zoom > 1){
                e.preventDefault();
                panX -= e.deltaX;
                panY -= e.deltaY;
                applyTransform();
            }

        },
        { passive:false }
    );


    // --------------------------------------------------
    // CONTROLLER SHOW / HIDE
    // --------------------------------------------------

    const controls =
        document.getElementById(
            "controls"
        );


    const hideControls =
        document.getElementById(
            "hide-controls"
        );


    const showControls =
        document.getElementById(
            "show-controls"
        );


    hideControls.addEventListener(
        "click",
        () => {

            controls.style.display =
                "none";


            showControls.style.display =
                "flex";

        }
    );


    showControls.addEventListener(
        "click",
        () => {

            controls.style.display =
                "flex";


            showControls.style.display =
                "none";

        }
    );


    // --------------------------------------------------
    // KEYBOARD NAVIGATION
    // --------------------------------------------------

    document.addEventListener(
        "keydown",
        e => {

            /*
             Don't hijack keyboard shortcuts
             while typing into the page input.
            */

            if(
                document.activeElement ===
                pageInput
            ){

                if(
                    e.key !== "Escape"
                ){

                    return;

                }

            }


            if(
                e.key === "ArrowRight"
            ){

                pageFlip.flipNext();

            }


            if(
                e.key === "ArrowLeft"
            ){

                pageFlip.flipPrev();

            }


            // + / = zoom in

            if(
                e.key === "+" ||
                e.key === "="
            ){

                applyZoom(
                    zoom + 0.05
                );

            }


            // - zoom out

            if(
                e.key === "-"
            ){

                applyZoom(
                    zoom - 0.05
                );

            }


            // 0 = reset zoom

            if(
                e.key === "0"
            ){

                applyZoom(
                    1,
                    false
                );

            }

        }
    );


    // --------------------------------------------------
    // ORIENTATION
    // --------------------------------------------------

    pageFlip.on(
        "changeOrientation",
        e => {

            console.log(
                e.data,
                window.innerWidth,
                window.innerHeight,
                container.clientWidth,
                container.clientHeight
            );

        }
    );


    // --------------------------------------------------
    // WINDOW RESIZE
    // --------------------------------------------------

    window.addEventListener(
        "resize",
        () => {

            pageFlip.updateOrientation();

            clampPan();

            applyTransform();


            console.log(
                pageFlip.getOrientation(),
                pageFlip.getBoundsRect()
            );

        }
    );


    // --------------------------------------------------
    // INITIAL TRANSFORM
    // --------------------------------------------------

    applyTransform();

}


// --------------------------------------------------
// START
// --------------------------------------------------

loadBook();

</script>
